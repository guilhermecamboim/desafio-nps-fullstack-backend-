spring.datasource.url=jdbc:mysql://localhost:3306/desafio
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# log config
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# Jackson 3 (Spring Boot 4) ordena as propriedades em ordem alfabética por padrão; mantém a ordem dos campos como no Jackson 2
spring.jackson.mapper.sort-properties-alphabetically=false
